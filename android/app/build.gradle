plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openenginesim.app'
    compileSdk 35
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'org.openenginesim.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2.2-android-alpha1'

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared',
                    '-DBUILD_TESTING=OFF',
                    '-DENGINE_SIM_BUILD_ANDROID=ON',
                    '-DENGINE_SIM_BUILD_DESKTOP=OFF',
                    '-DENGINE_SIM_BUILD_WEB=OFF',
                    '-DENGINE_SIM_BUILD_SCRIPTING=ON',
                    '-DENGINE_SIM_FETCH_SDL3=OFF'
            }
        }
    }

    buildFeatures {
        prefab true
    }

    sourceSets {
        main {
            // Package the existing simulator assets at the APK asset root.
            assets.srcDirs = ['../../../assets']
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../CMakeLists.txt')
            version '3.31.6'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation files('libs/SDL3-3.2.8.aar')
}
