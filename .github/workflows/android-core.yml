name: Android Scripting Test

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Preparar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            flex \
            libfl-dev \
            bison \
            ninja-build

          echo "=== FLEX ==="
          flex --version

          echo "=== BISON ==="
          bison --version

          echo "=== FlexLexer.h ==="
          dpkg -L libfl-dev | grep FlexLexer.h

      - name: Verificar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Instalar NDK
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            --licenses > /dev/null || true

          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "ndk;27.2.12479018"

      - name: Verificar NDK
        run: |
          echo "=== NDK ==="
          ls "$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          echo "NDK pronto."

      - name: Configurar Android ARM64 com Scripting
        run: |
          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_SIM_BUILD_DESKTOP=OFF \
            -DENGINE_SIM_BUILD_WEB=OFF \
            -DENGINE_SIM_BUILD_SCRIPTING=ON \
            -DBUILD_TESTING=OFF

      - name: Compilar Core
        run: |
          cmake --build build-android \
            --target engine-sim-core \
            --parallel 2

      - name: Compilar Render Support
        run: |
          cmake --build build-android \
            --target engine-sim-render-support \
            --parallel 2

      - name: Compilar Visualization
        run: |
          cmake --build build-android \
            --target engine-sim-visualization \
            --parallel 2

      - name: Compilar Scripting
        run: |
          cmake --build build-android \
            --target engine-sim-scripting \
            --parallel 2

      - name: Resultado
        run: |
          echo "=========================================="
          echo "ANDROID ARM64 TESTE CONCLUIDO"
          echo "Core              = OK"
          echo "Render Support    = OK"
          echo "Visualization     = OK"
          echo "Scripting         = OK"
          echo "=========================================="
