name: Android Core Test

on:
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  build-android-core:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar NDK
        run: sdkmanager "ndk;27.2.12479018"

      - name: Configurar CMake para Android ARM64
        run: |
          cmake \
            -S . \
            -B build-android \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_SDK_ROOT/ndk/27.2.12479018/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DENGINE_SIM_BUILD_DESKTOP=OFF \
            -DENGINE_SIM_BUILD_WEB=OFF \
            -DENGINE_SIM_BUILD_SCRIPTING=OFF \
            -DBUILD_TESTING=OFF

      - name: Compilar Engine Simulator Core
        run: |
          cmake --build build-android \
            --target engine-sim-core \
            --parallel 2
